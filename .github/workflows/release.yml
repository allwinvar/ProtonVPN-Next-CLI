name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build engine
        run: |
          cd engine
          CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags="-s -w" -o pvpn-engine .

      - name: Attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'engine/pvpn-engine'

      - name: Package release
        run: |
          mkdir -p release
          cp engine/pvpn-engine release/
          cp pvpn-next release/
          cp requirements.txt release/
          cp -r pvpn_cli/ release/pvpn_cli/
          cp -r docs/ release/docs/ 2>/dev/null || true
          tar -czf pvpn-next-linux.tar.gz -C release .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: pvpn-next-linux.tar.gz
          generate_release_notes: true   
