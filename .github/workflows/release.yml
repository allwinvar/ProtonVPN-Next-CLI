name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build engine
        run: |
          cd engine
          CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags="-s -w" -o pvpn-engine .

      - name: Install deps
        run: |
          pip install pyinstaller -r requirements.txt

      - name: Build portable executable
        run: |
          pyinstaller --onefile --name pvpn-next \
            --add-binary "engine/pvpn-engine:." \
            pvpn-next

      - name: Attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/pvpn-next'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v0.1.0' }}
          files: dist/pvpn-next
          generate_release_notes: true
